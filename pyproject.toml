[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-pipe"
version = "0.1.0"
description = "Failure-aware cost and runtime optimizer for memory-capped Dask batch pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Daksh Aggarwal" },
  { name = "Chaitanya Singh" },
  { name = "Ganant Awasthi" },
]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
data = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
]
dask = [
  "dask[dataframe,distributed]>=2024.8.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
]
ml = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8.2",
  "psutil>=5.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
]

[project.scripts]
safe-pipe = "safe_pipe.cli:main"

[tool.setuptools.packages.find]
include = ["safe_pipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
